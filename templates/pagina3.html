<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Página 3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <header>
        <h1>Página 3: Formulario POST/GET</h1>
        <nav><a href="{{ url_for('home') }}">← Volver al Inicio</a></nav>
    </header>

    <main id="main-content">
        <article class="caja-info">
            <h2>Formulario de Registro</h2>

            {% if mensaje %}
                <p style="color: green; font-weight: bold;">{{ mensaje }}</p>
                <p><strong>Datos recibidos:</strong> {{ datos.nombre }} ({{ datos.correo }}) - Nivel: {{ datos.nivel }}</p>
            {% endif %}

            <form action="{{ url_for('pagina3') }}" method="POST">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">

                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" required placeholder="Example@gmial.com>

                <label for="nivel">Nivel Educativo:</label>
                <select id="nivel" name="nivel">
                    <option value="Principiante">Principiante</option>
                    <option value="Intermedio">Intermedio</option>
                    <option value="Avanzado">Avanzado</option>
                </select>

                <label for="codigo">Código de Afiliado (Deshabilitado):</label>
                <input type="text" id="codigo" name="codigo" value="SYS-2026" disabled placeholder="Código de afiliado" style="background-color: #f0f0f0;">

                <button type="submit">Enviar Datos</button>
            </form>
        </article>
    </main>
</body>
</html>
